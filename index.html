<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>General Shop Stock Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>General Shop Stock Manager</h1>

    <!-- Form to add new item -->
    <form id="stockForm">
      <input type="text" id="itemName" placeholder="Item Name" required>
      <input type="number" id="itemQty" placeholder="Quantity" min="1" required>
      <input type="number" id="itemPrice" placeholder="Price (₹)" min="1" required>
      <button type="submit">Add Item</button>
    </form>

    <!-- Table to display stock -->
    <table id="stockTable">
      <thead>
        <tr>
          <th>Item Name</th>
          <th>Quantity</th>
          <th>Price (₹)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Items will be added here dynamically -->
      </tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('stockForm');
    const tableBody = document.querySelector('#stockTable tbody');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const qty = document.getElementById('itemQty').value;
      const price = document.getElementById('itemPrice').value;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${name}</td>
        <td>${qty}</td>
        <td>₹${price}</td>
        <td><button onclick="deleteRow(this)">Delete</button></td>
      `;

      tableBody.appendChild(row);
      form.reset();
    });

    function deleteRow(button) {
      const row = button.parentElement.parentElement;
      row.remove();
    }
  </script>

</body>
</html>
